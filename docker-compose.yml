services:
  vits2-train: # 訓練服務
    build:
      context: . # 指定構建上下文為專案根目錄
      dockerfile: Dockerfile # 使用專案根目錄下的 Dockerfile 進行環境建置 (包含 CUDA 12.1, Python 3.11)
    container_name: vits2-train # 容器名稱
    volumes:
      - .:/app # 掛載專案根目錄到容器內的 /app
      - ./datasets:/app/datasets # 掛載數據集目錄
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # 使用 NVIDIA GPU 驅動
              count: 1 # 明確指定使用 1 張顯卡
              capabilities: [gpu] # 啟用 GPU 能力
    environment:
      - NVIDIA_VISIBLE_DEVICES=0 # 指定可見的 GPU 編號
      - PYTHONUNBUFFERED=1 # 禁用 Python 輸出緩衝，確保日誌即時顯示
    # 擴大共享記憶體，防止 DataLoader 報錯
    shm_size: "8gb"
    # 或者可以使用 ipc: host 直接共用主機的共享記憶體
    profiles: ["train"] # 設定服務設定檔為 train，需手動指定啟動
    # 指定訓練指令，透過 -c 參數載入 config.yaml，該檔案內定義了訓練語言 (如: en-us, cmn, ja)
    command: python train.py -c datasets/ljs_base/config.yaml -m ljs_base

  vits2-inference: # 推論服務 (Jupyter Lab)
    build: .
    container_name: vits2-inference
    ports:
      - "8888:8888" # 將容器的 8888 端口映射到主機的 8888
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    shm_size: "4gb" # 推論服務的共享記憶體
    profiles: ["inference"] # 設定服務設定檔為 inference
    command: jupyter lab --ip=0.0.0.0 --allow-root --no-browser --NotebookApp.token='' # 啟動 Jupyter Lab

  vits2-resample: # 音訊重採樣服務
    build: .
    container_name: vits2-resample
    volumes:
      - .:/app
      - ./datasets:/app/datasets
    profiles: ["resample"]
    # 預設將 datasets 目錄下的 wav 轉換到 datasets_22k，採樣率 22050
    command: bash /app/scripts/resample.sh /app/datasets/ljs_base/wavs /app/datasets/ljs_base/wavs_22k 22050
